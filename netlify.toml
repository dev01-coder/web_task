[build]
  command = "pip install -r requirements.txt && python build.py"
  publish = "build"

[build.environment]
  PYTHON_VERSION = "3.11"

# Pretty URLs - redirect /about to /about/
[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/projects"
  to = "/projects/"
  status = 301

[[redirects]]
  from = "/services"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

# Handle 404 errors
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
