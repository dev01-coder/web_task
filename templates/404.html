{% extends "base.html" %}

{% block title %}Page Not Found - Ozair Ilyas{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row align-items-center not-found-row">
        <div class="col-md-8 mx-auto text-center">
            <h1 class="display-1 fw-bold mb-4">404</h1>
            <h2 class="mb-4">Page Not Found</h2>
            <p class="lead mb-4">Sorry, the page you're looking for doesn't exist. It might have been moved or deleted.</p>
            
            <div class="mb-4">
                <i class="fas fa-search fa-5x text-muted"></i>
            </div>
            
            <div class="d-flex gap-3 justify-content-center">
                <a href="/" class="btn btn-primary btn-lg">
                    <i class="fas fa-home me-2"></i>Go Home
                </a>
                <a href="/projects" class="btn btn-outline-primary btn-lg">
                    <i class="fas fa-folder me-2"></i>View Projects
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    body {
        display: flex;
        flex-direction: column;
    }
    
    .container {
        flex: 1;
    }
    
    .not-found-row {
        min-height: 500px;
    }
</style>
{% endblock %}
