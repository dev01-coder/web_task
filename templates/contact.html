{% extends "base.html" %}

{% block title %}Contact - My Portfolio{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="mb-5 text-center">Get In Touch</h1>
    
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="row mb-5">
                <div class="col-md-4 text-center mb-4">
                    <div class="contact-info-card">
                        <i class="fas fa-envelope fa-2x text-primary mb-3"></i>
                        <h5>Email</h5>
                        <p><a href="mailto:sardarozair13@gmail.com" class="text-decoration-none">sardarozair13@gmail.com</a></p>
                    </div>
                </div>
                <div class="col-md-4 text-center mb-4">
                    <div class="contact-info-card">
                        <i class="fab fa-linkedin fa-2x text-primary mb-3"></i>
                        <h5>LinkedIn</h5>
                        <p><a href="https://pk.linkedin.com/in/ozair-ilyas" class="text-decoration-none">pk.linkedin.com/in/ozair-ilyas</a></p>
                    </div>
                </div>
                <div class="col-md-4 text-center mb-4">
                    <div class="contact-info-card">
                        <i class="fab fa-github fa-2x text-primary mb-3"></i>
                        <h5>GitHub</h5>
                        <p><a href="https://github.com" class="text-decoration-none" target="_blank" rel="noopener noreferrer">github.com/ozairilyas</a></p>
                    </div>
                </div>
            </div>
            
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="card-title mb-4">Send Me a Message</h4>
                    
                    <form id="contactForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address *</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="subject" class="form-label">Subject</label>
                            <input type="text" class="form-control" id="subject" name="subject">
                        </div>
                        
                        <div class="mb-3">
                            <label for="message" class="form-label">Message *</label>
                            <textarea class="form-control" id="message" name="message" rows="6" required></textarea>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="terms" required>
                            <label class="form-check-label" for="terms">
                                I agree to the privacy policy
                            </label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-paper-plane"></i> Send Message
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
    };
    
    fetch('/contact', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            document.getElementById('contactForm').reset();
            alert('Thank you! Your message has been sent successfully. I\'ll get back to you soon.');
        } else {
            alert('Oops! Something went wrong. Please try again.');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Error sending message. Please try again.');
    });
});
</script>
{% endblock %}
