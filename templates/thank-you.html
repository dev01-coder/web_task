{% extends "base.html" %}

{% block title %}Thank You - Ozair Ilyas{% endblock %}

{% block content %}
<section class="page-header">
    <canvas class="ai-page-canvas" aria-hidden="true"></canvas>
    <div class="container" style="position:relative;z-index:1;">
        <h1>Thank You</h1>
        <p>Your message has been sent successfully</p>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center reveal">
                <div class="glass-card">
                    <div class="icon-wrapper" style="background: rgba(16, 185, 129, 0.15);">
                        <i class="fas fa-check" style="color: #10b981;"></i>
                    </div>
                    <h3 class="mb-3" style="color: var(--text-heading);">Message Sent!</h3>
                    <p style="color: var(--text-secondary); margin-bottom: 2rem;">
                        Thank you for reaching out. I'll get back to you as soon as possible.
                    </p>
                    <div class="d-flex gap-3 justify-content-center flex-wrap">
                        <a href="/" class="btn btn-primary">
                            <i class="fas fa-home me-2"></i>Back to Home
                        </a>
                        <a href="/contact/" class="btn btn-outline-primary">
                            <i class="fas fa-envelope me-2"></i>Send Another
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
